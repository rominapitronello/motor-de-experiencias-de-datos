# conector público: sin estado, sin llaves, sin OAuth. el conocimiento se compila desde el repo en cada deploy.
name = "experiencias-datos"
main = "src/index.js"
compatibility_date = "2026-09-01"

# límite de tasa: 60 llamadas por minuto por IP y por ubicación de Cloudflare.
# la IP se usa solo como clave del contador; no se guarda ni se registra.
# sintaxis vigente según https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/ (wrangler >= 4.36).
[[ratelimits]]
name = "LIMITE"
namespace_id = "74701"
  [ratelimits.simple]
  limit = 60
  period = 60
