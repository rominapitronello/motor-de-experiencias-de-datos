# conector público: sin estado, sin llaves, sin OAuth. el conocimiento se compila desde el repo en cada deploy.
name = "experiencias-datos"
main = "src/index.js"
compatibility_date = "2026-09-01"

# límite de tasa: 60 llamadas por minuto por IP y por ubicación de Cloudflare.
# la IP se usa solo como clave del contador; no se guarda ni se registra.
# sintaxis vigente según https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/ (wrangler >= 4.36).
[[ratelimits]]
name = "LIMITE"
namespace_id = "74701"
  [ratelimits.simple]
  limit = 60
  period = 60

# medición (0.3.5, decidida por romina en el issue #43, 2-nov-2026): se cuenta la FORMA de la pregunta, nunca la pregunta.
# por cada consultar_grafo: versión, tarea resuelta (o «ninguna»), ámbito (o «ninguno»), cómo se resolvió (id / sinónimo / no),
# si hubo foco parcial y propósito sugerido. sin texto, sin montos, sin nombres, sin IP. régimen: PRIVACIDAD.md.
[[analytics_engine_datasets]]
binding = "MEDICION"
dataset = "experiencias_datos_medicion"
