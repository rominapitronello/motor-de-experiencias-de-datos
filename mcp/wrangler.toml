# conector público: sin estado, sin llaves, sin OAuth. el conocimiento se compila desde el repo en cada deploy.
name = "experiencias-datos"
main = "src/index.js"
compatibility_date = "2026-09-01"

# límite de tasa: activarlo antes de publicar el endpoint.
# la sintaxis de rate limiting de Workers cambió en el tiempo; verificar la vigente en la documentación de Cloudflare
# (https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/) y descomentar lo que corresponda.
# [[ratelimits]]
# name = "LIMITE"
# namespace_id = "1001"
# simple = { limit = 60, period = 60 }
