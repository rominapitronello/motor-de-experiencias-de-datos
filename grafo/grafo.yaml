# v0.2 — bloques nuevos. opus 5.5, 2-nov-2026. todo INFERENCIA salvo donde se cite otra fuente.

como_elegir_ambito: |
  el ámbito dice qué restricciones y qué cuidados aplican. se elige por dos preguntas, en este orden:
  1. ¿la unidad de análisis son personas que no están en la conversación (trabajadores encuestados, vendedores, socios)? → personas, aunque el excel sea de quien pregunta.
  2. si no, ¿de quién son los datos? de un organismo público (censo, INE, ministerios) → territorio_o_servicio; de quien pregunta o de su organización → datos_propios; de un grupo que los levanta y los mira junto (un curso, un taller) → la_sala.
  3. (v0.3, #22) si la unidad no es una persona ni un lugar y los datos no son de nadie en la conversación (instancias de un modelo, productos de un catálogo, máquinas, el elefante del zoológico) → cosas. si son cosas de quien pregunta (sus ventas, su perro, su caja), sigue siendo datos_propios.
  si no se puede saber, el conector no adivina: entrega todas las restricciones con su condición y lo declara (contrato del pr #3).

cuidados:   # las trampas de la vida diaria. no son TR-xx: esas están verificadas por código sobre datos públicos chilenos (trampas/).
            # estas son INFERENCIA desde el corpus (pr #16) y los comentarios de los haikus; se vuelven VERIFICADO si alguien las reproduce.
  - {id: CU-01, nombre: "la memoria como fuente", que_pasa: "«lo que me acuerdo», «tiro un número»: un recuerdo se presenta como si fuera un dato", que_hacer: "decir que es una estimación de memoria, darla como rango y, si se puede, ofrecer contar desde hoy", corpus: [cart-05, casa-13, casa-15, prof-07]}
  - {id: CU-02, nombre: "el mes incompleto", que_pasa: "comparar el mes en curso con uno cerrado hace parecer que se gastó menos", que_hacer: "comparar meses cerrados, o el mismo número de días de cada mes, y decir cuál se usó", corpus: [cart-02, cart-04, casa-10]}
  - {id: CU-03, nombre: "el dato que falta no es cero", que_pasa: "un mes sin registro o una cuenta sin datos se dibuja como cero y parece una caída", que_hacer: "dejar el hueco a la vista con una nota de por qué falta (ver lo_que_falta_no_es_cero)", corpus: [ppt-11, ppt-17]}
  - {id: CU-04, nombre: "la categoría la pone quien lee", que_pasa: "la cartola dice el nombre del comercio, no «comida al paso» ni «delivery»; clasificar es una decisión", que_hacer: "mostrar qué se contó dentro de cada categoría y dejar que la persona mueva lo que no le cuadra", corpus: [cart-01, cart-03, cart-20]}
  - {id: CU-05, nombre: "el mes de la compra no es el mes del cargo", que_pasa: "una compra en cuotas o un cobro anual aparece repartido o atrasado y descuadra el mes", que_hacer: "decir si se cuenta por fecha de compra o por fecha de cargo", corpus: [cart-18, cart-19, cart-12]}
  - {id: CU-06, nombre: "la sala se mueve mientras se cuenta", que_pasa: "llega alguien atrasado, alguien levanta la mano dos veces, alguien no la levanta", que_hacer: "cerrar el conteo con una suma que cuadre con los presentes, y si no cuadra, decirlo en voz alta", corpus: [prof-01, prof-06, prof-17, prof-02]}
  - {id: CU-07, nombre: "los que respondieron no son todos", que_pasa: "el 70 % de 45 que respondieron se presenta como el 70 % de los 60", que_hacer: "escribir siempre de cuántos es el porcentaje, y cuántos no respondieron", corpus: [ppt-05, ppt-06, ppt-18, prof-20]}
  - {id: CU-08, nombre: "descomponer no es explicar", que_pasa: "el desglose dice qué parte subió (consumo, tarifa), no por qué subió", que_hacer: "mostrar el desglose y decir qué no sabemos de la causa; el porqué lo pone la persona o una fuente que lo diga", corpus: [cart-09, num-02, ppt-09]}
  # v0.3, opus 5.5: los cuidados de reconocer y de las cosas. INFERENCIA desde corpus/no-sabe-que-tiene.json y el issue #22.
  - {id: CU-09, nombre: "lo que no sabías que tenías, alguien más sí lo sabe", que_pasa: "al descubrir que tiene datos, la persona descubre también que una app, un banco o un correo los guarda; se puede ir al pánico («me espían») o al «qué más da»", que_hacer: "sin sermón y sin asustar: mostrar un dato suyo concreto, qué sabe el servicio de él, cómo se mira o se descarga, y dejar que ella decida qué le importa (quien_mas_lo_ve)", corpus: [nsq-02, nsq-07, nsq-08, nsq-11, nsq-19, nsq-20]}
  - {id: CU-10, nombre: "lo que se sabe y lo que se sospecha", que_pasa: "«el celular me escucha», «la publicidad sabe lo que hablé con mi hermana»: una sospecha se trata como hecho, o un hecho comprobable se descarta como paranoia", que_hacer: "separar en dos columnas lo que se puede comprobar (está en la configuración, en la descarga de la cuenta) de lo que se sospecha, y decir cómo se comprobaría lo segundo; es la misma diferencia entre conocer e inferir que pide PARA_QUIEN.md", corpus: [nsq-07, nsq-08, nsq-11, nsq-17]}
  - {id: CU-11, nombre: "qué cuenta como uno", que_pasa: "«cuántas personas entran» y «cuántas ventas hubo» no son lo mismo; «una instancia» puede ser una conversación, una ventana o un modelo; sin decir qué es uno, el conteo no cuadra con nada", que_hacer: "escribir junto al número qué se contó como uno y qué quedó fuera; si el registro cuenta otra cosa (la caja cuenta ventas, no entradas), decirlo y ofrecer contar lo que se quería", corpus: [nsq-01, nsq-16, nsq-15]}

