    distribucion: [histograma, boxplot, ranked_dots, barras_simples, palitos, pictograma]   # fable, 25-sep-2026: la tarea estaba en el vocabulario sin aristas · + v0.2 opus: INFERENCIA, puntos uno por uno con N chico (nota de legible en boxplot); barras en orden natural para meses (prof-19, ppt-19)
    parte_todo: [barras_apiladas, barras_simples, lista_corta, cifra_grande, pictograma, palitos, tabla_en_voz_alta]  # + v0.2 opus: INFERENCIA: «en qué se me va la plata» se lee mejor en barras ordenadas que en una torta (cart-03, num-10, num-19); en la sala, los grupos se cuentan con la mano (prof-08, prof-16, prof-17)
    relacionar: [dispersion, ranked_dots, pequenos_multiplos]
    flujo: [flujos_agregados]
    secuencia: [linea_de_tiempo]
    estado: [matriz_estados, barra_de_avance, lista_corta]  # + v0.2 opus: INFERENCIA (ppt-08, prof-05, prof-11, cart-19)
    incertidumbre: [resultados_discretos]
    # fuente, además de hullman 2018: cuadro n.º 1, «deficiencia en viviendas en 1952, según diferentes hipótesis (cifras redondas)», p. 112 de corfo,
    # «programa nacional de desarrollo económico 1961-1970» (título según romina, que tiene el ejemplar; fecha de edición: null), fotografiado por romina en la feria de av. valparaíso (#27). siete hipótesis en vez de una cifra: el déficit va de 45 a 447 mil
    # viviendas, y con la hipótesis cambia también la conclusión: en I y II la mayoría es rural (58 y 60 %), de la III en adelante es urbana.
    # opus 5.5 verificó las 28 sumas y porcentajes del cuadro: todas cuadran. la definición no mueve solo el tamaño, mueve la historia.
    procedencia: [ficha_procedencia]
    vacio: [mapa_sin_base, ficha_procedencia, planilla_para_empezar]  # + v0.2 opus: INFERENCIA: cuando nadie lo contó, la experiencia es empezar a contarlo (casa-19, casa-06, casa-14)
    # v0.2, opus 5.5: aristas de las tres tareas nuevas. INFERENCIA desde el corpus.
    estimar: [cuenta_a_la_vista, cifra_grande, resultados_discretos, pictograma]  # + v0.3 opus: INFERENCIA: con un niño al lado, el elefante se cuenta en bolsas dibujadas (nsq-03)
    proyectar: [linea_con_proyeccion, cifra_grande, resultados_discretos]
    leer: [lo_mismo_anotado, cifra_grande]
    # v0.3, opus 5.5: aristas de reconocer. INFERENCIA desde corpus/no-sabe-que-tiene.json; referentes P-37 y P-10 del catálogo de sol.
    reconocer: [un_registro_desarmado, inventario_de_lo_que_tienes, quien_mas_lo_ve, pregunta_de_vuelta, planilla_para_empezar]
  proposito_tecnica:          # ids de catalogo/tecnicas.yaml
    escala_humana: [T-02, T-16]
