toda_experiencia:
  - {id: se_adapta, desc: "el lenguaje, el primer paso y el siguiente se eligen por lo que la persona dijo y pidió, no por lo que se supone de ella (ni por su ortografía, su acento o su edad). andamiaje, como dice la carta: Vigotsky. el contrato está en ves/schema.json, didactica.andamiaje (sol, #25)"}
  - {id: no_califica, desc: "más divertido que el colegio: nada de notas ni de bien/mal. ver la restricción dura no_se_califica"}
  - {id: se_puede_salir, desc: "una cifra y listo también es una experiencia completa. el siguiente paso se ofrece y se puede decir que no (paso_opcional en la VES)"}
  - {id: se_sabe_y_se_infiere, desc: "toda experiencia separa lo que el dato dice de lo que se pone encima (un rango, un supuesto, un promedio, una sospecha), con dulzura y sin jerga. es la misma diferencia que hay entre un modelo que se equivoca y uno que engaña (romina, #15)"}
  - {id: chistosa_si_cabe, desc: "el humor es bienvenido cuando la pregunta lo trae (la caca del perro, el elefante) y nunca a costa de la persona; que sea fácil y que sea PEF"}
