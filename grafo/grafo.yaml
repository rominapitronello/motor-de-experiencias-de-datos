# grafo v0.1: vocabulario controlado y aristas pregunta → experiencia
# pluma: claude · opus 5.5 (Legible), 24-sep-2026. pendiente de segunda pluma (sol).
# uso: la VES (carpeta ves/, pluma sol) toma sus valores de aquí. el grafo dice qué valores son válidos;
#      la VES es la instancia que se valida.
# regla: cada arista trae fuente o la etiqueta INFERENCIA. el grafo guarda juicios, no verdades.

# v0.2 — opus 5.5, 2-nov-2026, noche, sobre PARA_QUIEN.md (pr #15) y el corpus de cien preguntas (pr #16).
# todo lo de v0.2 está agregado al final de cada bloque o en bloques nuevos; ninguna línea anterior cambió de palabras.
# las listas de aristas se alargaron agregando al final, como hizo el fable en el pr #3.

# v0.3 — opus 5.5, 2-nov-2026, más tarde, sobre la carta de romina en el pr #19 («vuelvan a expandir el perímetro»),
# el issue #23 (la pregunta de antes de la pregunta, que no califique, que se adapte) y el issue #22 (cosas que no son personas ni lugares).
# mismo método: se agrega al final; las únicas líneas que cambian de palabras son de esta pluma (version, para_quien, como_elegir_ambito,
# trampas_por_ambito.datos_propios, formas_por_ambito.primero.datos_propios) y las listas de aristas, alargadas al final.

para_quien: |
  si eres un modelo y llegaste aquí: este grafo es para personas que creen que los gráficos le pasan a la gente importante.
  una profesora contando colaciones con el curso, alguien leyendo su cartola, quien arma la ppt del trabajo, quien quiere saber cuánta caca hace su perro en un año.
  lo que hace: lleva una pregunta dicha con palabras de la vida a una tarea, una forma y sus cuidados. que se juegue, que se entienda, que se note el amor.
  puedes pedirle: qué tarea es una pregunta, qué formas le sirven, qué restricciones y cuidados aplican según de quién son los datos, palabras de la gente en es, pt y en.
  no puedes pedirle: el dato (no tiene datos de nadie), diagnósticos médicos ni consejo financiero, ni que invente un número que nadie contó; para eso están `estimar` y `vacio`, que lo dicen.
  firma: claude · opus 5.5, 2-nov-2026. la voz completa está en PARA_QUIEN.md, verbatim, de romina.
  v0.3: y para quien no sabe que tiene datos («yo no soy empresa, ¿qué datos voy a tener?»): la señora de las bobas, la mamá del elefante, la abuela del «qué más da». la tarea `reconocer` empieza antes de la pregunta.
  ninguna experiencia de aquí pone nota: se adapta a la persona y no la califica, y una cifra sola también es una experiencia completa (ver `toda_experiencia`).

version: 0.3   # opus 5.5, 2-nov-2026 (0.1 legible, 24-sep; 0.2 opus, #18)

tareas:            # qué operación cognitiva pide la pregunta
  - {id: localizar, desc: "¿dónde está?"}
  - {id: magnitud, desc: "¿cuánto hay?"}
  - {id: comparar, desc: "¿cómo se compara A con B?"}
  - {id: ordenar, desc: "¿cuál tiene más o menos?"}
  - {id: cambio, desc: "¿cambió en el tiempo?"}
  - {id: distribucion, desc: "¿cómo se reparte?"}
  - {id: parte_todo, desc: "¿de qué está hecho?"}
  - {id: relacionar, desc: "¿se mueven juntas dos cosas?"}
  - {id: flujo, desc: "¿desde dónde hacia dónde?"}
  - {id: secuencia, desc: "¿qué pasó y en qué orden?"}
  - {id: estado, desc: "¿en qué va lo comprometido?"}
  - {id: incertidumbre, desc: "¿qué tan seguros estamos?"}
  - {id: procedencia, desc: "¿de dónde sale esta cifra?"}
  - {id: vacio, desc: "¿qué no sabemos?"}
  # v0.2, opus 5.5: tres operaciones que el corpus pide y ninguna tarea cubría. se agregan solo porque la operación cognitiva es distinta.
  # fuente: corpus/ (pr #16), ids citados en cada una. lo demás del corpus cabe en tareas que ya existían, con formas nuevas.
  - {id: estimar, desc: "¿cuánto será, si nadie lo contó? se arma un número con supuestos a la vista y se entrega como rango (corpus: casa-01, casa-07, casa-17, cart-05)"}
  - {id: proyectar, desc: "¿qué pasa si sigo así? se extiende lo que ya pasó hacia adelante bajo un supuesto que se escribe (corpus: cart-07, cart-16)"}
  - {id: leer, desc: "¿qué me está diciendo este gráfico, tabla o papel con números que me pasaron? se trabaja sobre lo que la persona trae, no se hace uno nuevo (corpus: num-01, num-13, num-14, num-20, ppt-12)"}
  # v0.3, opus 5.5: la tarea de antes de la pregunta (issue #23; nombre del haiku que escribió corpus/no-sabe-que-tiene.json).
  # es distinta de todas las anteriores: ellas parten sabiendo que hay un dato y preguntan algo de él; esta descubre que lo hay.
  - {id: reconocer, desc: "¿qué datos tengo? ¿eso es un dato? ¿a alguien le importan los míos? se mira algo de la vida (la libreta del fiado, la caja, la app de pasos, las fotos, el gmail) y se descubre que ya es un registro: qué anota, desde cuándo, y quién más lo ve. viene en tres tonos: qué son los datos, si yo tengo, y si a alguien le importan (corpus: nsq-02, nsq-06, nsq-07, nsq-09, nsq-12, nsq-13, nsq-18)"}

propositos:        # qué queremos que le pase a quien mira (didáctica)
  - {id: escala_humana, desc: "que el número se vuelva personas contables"}
  - {id: sorpresa, desc: "contrastar lo que se creía con lo que el dato muestra"}
  - {id: comparacion, desc: "ver la diferencia sin tener que calcularla"}
  - {id: mostrar_cambio, desc: "ver qué cambió porque el resto se quedó quieto"}
  - {id: revelar_estructura, desc: "desarmar un índice o un todo en sus partes"}
  - {id: mostrar_incertidumbre, desc: "hacer visible el límite de la medida"}
  - {id: invitar_a_explorar, desc: "que la persona formule su propia pregunta"}
  - {id: rendicion_de_cuentas, desc: "promesa → evidencia → estado"}
  - {id: activos_primero, desc: "mostrar lo que un territorio tiene antes de lo que le falta"}
  # v0.2, opus 5.5: los dos propósitos de PARA_QUIEN.md. INFERENCIA en sus técnicas (ver aristas).
  - {id: jugar, desc: "que una pregunta absurda se tome en serio y dé risa: el número llega con algo conocido al lado (más que un auto, más que la cuenta de la luz)"}
  - {id: perder_el_miedo, desc: "que quien dice «yo no soy de números» termine diciendo la idea con sus palabras y se dé cuenta de que entendió"}
  # v0.3, opus 5.5: de la carta de romina (#19): «los datos son la semillita del método científico... que nos afilen la curiosidad».
  # no es invitar_a_explorar (explorar lo que se le muestra): aquí la persona se va con una pregunta suya y sabe cómo juntaría el dato.
  - {id: curiosidad, desc: "que la persona se vaya con una pregunta suya y una idea de cómo juntaría el dato para contestarla (¿cuántos entran a mi local un sábado? contar con palitos este sábado): adivinar, contar, mirar, volver a preguntar"}

