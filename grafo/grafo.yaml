    # v0.2, opus 5.5. INFERENCIA: técnicas del catálogo de sol que acompañan estos propósitos.
    jugar: [T-01, T-02, T-10]              # predecir antes de ver da la risa; isotype y trazo rough le quitan solemnidad
    perder_el_miedo: [T-15, T-19, T-14]    # tarjeta que se da vuelta, anotación manuscrita y un paso a la vez: de a poco y con letra de persona
    curiosidad: [T-01, T-18]               # v0.3 opus, INFERENCIA: adivinar antes de ver es la hipótesis; guiar y después soltar es el «ahora pregunta tú»
  patron_compromiso:          # INFERENCIA: qué patrón suele alcanzar qué nivel ICAP
    predict_reveal: constructivo
    recall_guess_feedback: constructivo
