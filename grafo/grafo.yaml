  estado:        {es: ["cuánto nos falta", "llevamos", "cuánto falta pa el recreo", "cuántas cuotas me quedan"], pt: ["quanto falta", "já temos"], en: ["how much is left", "how far along are we"]}
  vacio:         {es: ["no sé cuántos", "el sistema no lo guardaba", "sin que nadie me viera"], pt: ["não sei quantos", "o sistema não guardou"], en: ["I don't know how many", "nobody counted"]}
  procedencia:   {es: ["de dónde sale este número", "es verdad o es mentira"], pt: ["de onde vem esse número"], en: ["where does this number come from"]}
