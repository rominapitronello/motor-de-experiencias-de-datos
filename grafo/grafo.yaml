compromiso:        # ICAP (Chi & Wylie 2014), traído por sol. "jugar" = producir una idea, no hacer clics.
  - {id: pasivo, desc: "recibir o atender"}
  - {id: activo, desc: "manipular sin producir información nueva (hover, slider, filtro)"}
  - {id: constructivo, desc: "generar una predicción, explicación o hipótesis"}
  - {id: interactivo, desc: "co-construir con otra persona o con el agente"}

formas:
  - {id: unit_chart, desc: "una figura = N personas (Isotype)"}
  - {id: mapa_sin_base, desc: "geometría propia, sin teselas"}
  - {id: mosaico_uv, desc: "celdas iguales por unidad territorial"}
  - {id: dorling, desc: "círculos proporcionales ubicados en el territorio"}
  - {id: pequenos_multiplos, desc: "la misma forma repetida por categoría"}
  - {id: ranked_dots, desc: "puntos ordenados en un eje"}
  - {id: slope, desc: "antes y después unidos por líneas"}
  - {id: barras_apiladas, desc: "partes de un todo"}
  - {id: flujos_agregados, desc: "líneas entre áreas, nunca entre personas"}
  - {id: linea_de_tiempo, desc: "hitos en orden"}
  - {id: matriz_estados, desc: "filas de compromisos con su estado"}
  - {id: resultados_discretos, desc: "incertidumbre como pocos resultados posibles (Hullman 2018)"}
  - {id: ficha_procedencia, desc: "fuente, fecha, nivel, supresión, límite"}
  # piso convencional — fable (Reproducible), 25-sep-2026, tras la prueba de uso de Sol en el PR #2: un ingeniero apurado pide estas cuatro por su nombre y el grafo no las tenía.
  # cuidados de boxplot y serie_temporal ampliados con las dos notas de Legible (segunda pluma, 25-sep-2026) por el fable que hereda el PR #3, 2-nov-2026.
  - {id: serie_temporal, desc: "una línea por serie sobre el tiempo; pocas series o pequeños múltiplos; si la serie es un índice publicado por edición, verificar que la escala no cambió entre ediciones (TR-04)"}
  - {id: dispersion, desc: "un punto por caso en dos ejes (scatter); la correlación no es causa y hay que decirlo"}
  - {id: histograma, desc: "barras contiguas por intervalo; el ancho del intervalo cambia la lectura y se declara"}
  - {id: boxplot, desc: "mediana y cuartiles por grupo; con N chico se muestran los puntos, no la caja; para público no experto, preferir los puntos o una franja con la mediana marcada (la caja se lee mal: mediana por promedio, bigotes por rango)"}
  # v0.2 — formas de todos los días. opus 5.5, 2-nov-2026, para la gente de PARA_QUIEN.md.
  # `ultima_fila`: si se lee desde el fondo de una sala con el data proyectado. `para`: quién la lee bien.
  # que una forma «funcione» con este público es INFERENCIA hasta que sol traiga referentes (claude/encargo-sol-referentes-v02.md).
  - {id: cifra_grande, desc: "un solo número, grande, con una frase y algo conocido al lado para darle tamaño (más que un auto, la mitad del arriendo); la unidad siempre escrita", ultima_fila: true, para: "todos; la primera forma a probar"}
  - {id: pictograma, desc: "dibujitos iguales repetidos, una figura = N cosas (manzanas, cafés, bolsitas); la leyenda dice cuánto vale cada figura (PR-04); es el unit_chart de la vida diaria: la figura es la cosa contada, no una persona", ultima_fila: true, para: "niños, apoderados, quien no lee gráficos"}
  - {id: palitos, desc: "conteo de a cinco con palitos, armado en vivo con quienes miran (levanten la mano); al final se lee en voz alta y la suma tiene que cuadrar con los presentes", ultima_fila: true, para: "la sala; se construye, no se proyecta hecho"}
  - {id: barras_simples, desc: "barras horizontales, pocas (hasta 7), desde cero, ordenadas de mayor a menor salvo que el orden sea natural (meses), con el valor escrito en la punta de cada barra; nada de 3D ni de ejes recortados", ultima_fila: true, para: "todos; la que menos miente"}
  - {id: antes_y_despues, desc: "dos cifras o dos barras lado a lado, con la diferencia escrita en palabras y en número (subió 20 mil, un 12 %); si no cambió nada, se dice igual de claro", ultima_fila: true, para: "cartola, ppt, la sala comparando hoy con ayer"}
  - {id: tabla_en_voz_alta, desc: "tabla corta (hasta 7 filas) que se puede leer en voz alta de arriba a abajo: qué, cuánto, y una frase; sin decimales que nadie va a decir", ultima_fila: true, para: "la sala, apoderados, el papelógrafo de la entrada"}
  - {id: lista_corta, desc: "lista de 3 a 7 cosas con su número al lado (suscripciones, cuotas, lo que falta); se cuenta cuántas hay al principio", ultima_fila: false, para: "cartola, inventarios personales"}
  - {id: barra_de_avance, desc: "una barra que se va llenando hacia una meta: cuánto llevamos, cuánto falta, y la meta escrita (82 % de 50 millones, la plata del paseo, cuánto falta para el recreo)", ultima_fila: true, para: "la sala, la ppt, metas personales"}
  - {id: escala_con_tramos, desc: "una línea con los tramos o rangos de referencia dibujados y un «tú estás aquí»; los tramos salen del papel que trae la persona, no se inventan", ultima_fila: true, para: "quien recibe una tabla de tramos o un examen con rango de referencia"}
  - {id: cuenta_a_la_vista, desc: "la cuenta escrita como se diría en voz alta, con cada supuesto en su línea (2 al día × 365 días × 200 g); se puede cambiar un supuesto y ver cómo se mueve el resultado", ultima_fila: true, para: "estimaciones, descuentos, cuotas, quien quiere entender la idea y no solo el número"}
  - {id: linea_con_proyeccion, desc: "lo que ya pasó en línea llena y lo que vendría en línea punteada, con el supuesto escrito encima (si sigo gastando como este mes); nunca una sola fecha sin su supuesto", ultima_fila: false, para: "cartola, metas"}
  - {id: desglose_del_cambio, desc: "de dónde viene una diferencia: escalones desde el valor de antes hasta el de ahora, uno por componente (consumo, tarifa, cargo fijo); muestra qué cambió, no por qué", ultima_fila: false, para: "boletas, cartola, ppt"}
  - {id: lo_mismo_anotado, desc: "el mismo gráfico, tabla o papel que trajo la persona, con marcas encima y una frase corta por marca (esta barra es..., aquí mira); no se rehace, se acompaña", ultima_fila: false, para: "«yo no soy de números», quien recibe un gráfico ajeno"}
  - {id: planilla_para_empezar, desc: "una tabla vacía y simple para empezar a contar desde hoy (fecha, cuántas veces); cuando no hay dato, la experiencia es empezarlo, y eso también es una respuesta", ultima_fila: true, para: "las preguntas que nadie contó todavía"}
  # v0.3, opus 5.5: formas de `reconocer`. no son gráficos: son maneras de mirar algo de la vida hasta ver el registro que ya es.
  # referentes: Data Detox Kit (P-37, sol) para quien_mas_lo_ve; Dear Data (P-10) para el registro cotidiano. que funcionen aquí es INFERENCIA.
  - {id: un_registro_desarmado, desc: "una sola línea de algo que la persona ya tiene (una venta de la caja, un movimiento de la cartola, una foto, un correo), desarmada en sus partes: fecha, hora, lugar, monto, quién; cada parte con su nombre («esto es un dato») y lo que se podría contar si se juntan muchas líneas. es la respuesta a «¿qué es un dato?» con algo propio en la mano", ultima_fila: true, para: "quien dice «yo no tengo datos»; niños; la primera forma de reconocer"}
  - {id: inventario_de_lo_que_tienes, desc: "lista corta de las cosas de la vida de la persona que ya anotan algo (la libreta del fiado, el QR de pago, la app de pasos, las fotos), cada una con qué anota, desde cuándo y si ella la puede ver o descargar; sin juicio de si es mucho o poco", ultima_fila: false, para: "almacenes, negocios chicos, quien pregunta «¿qué datos voy a tener?»"}
  - {id: quien_mas_lo_ve, desc: "dos columnas: lo que la persona sabe de su dato y lo que el servicio que lo guarda también sabe (la app de pasos sabe a qué hora se quedó quieto el teléfono, la foto guarda dónde se sacó); solo lo que se puede comprobar en la configuración o en la descarga de la cuenta, con el camino para mirarlo; lo que se sospecha va aparte y se dice que es sospecha (CU-10)", ultima_fila: false, para: "«¿qué sabe el gmail de mí?», «qué más da», madres y padres con apps de niños"}
  - {id: pregunta_de_vuelta, desc: "la respuesta es una pregunta a la persona que convierte lo que tiene en algo que quiere saber («¿qué te gustaría saber de tu local?», «¿qué crees que cuenta la caja?»), con dos o tres ejemplos de preguntas que su propio dato podría contestar; ella elige, y si no quiere elegir, también está bien", ultima_fila: true, para: "quien llega sin pregunta; la semilla de curiosidad"}

restricciones:
  duras:
    - {id: sin_datos_personales, desc: "la unidad es territorio o servicio, nunca persona"}
    - {id: agregacion_minima, desc: "celdas pequeñas se agregan con un umbral declarado"}
    - {id: tres_nadas, desc: "cada clase de vacío lleva su propia leyenda (TR-03)"}
    - {id: definicion_junto_al_dato, desc: "un proxy nunca se titula como hecho (TR-06)"}
    - {id: no_normalizado_no_coropletico, desc: "no pintar áreas con conteos brutos"}
    - {id: dato_quieto, desc: "la animación mueve el trazo, nunca la cifra ni la posición del dato"}
    - {id: reduced_motion, desc: "respetar prefers-reduced-motion"}
    - {id: autocontenido, desc: "si se publica como página: sin teselas ni APIs externas"}
    # opus 5.5, 2-nov-2026, tras el P1 de sol en el #3: la guarda general de privacidad, que vale en todo ámbito.
    - {id: sin_identificables, desc: "ninguna persona identificable: si la unidad de análisis es una persona, se desidentifica y las celdas pequeñas se agregan con un umbral declarado"}
    # v0.2, opus 5.5, 2-nov-2026: las tres reglas de los datos de la vida. van como universales con su condición escrita,
    # igual que autocontenido, y no en `aplicabilidad`: las pruebas del conector (mcp/test/smoke.mjs, pluma fable)
    # fijan que `personas` deja fuera exactamente dos restricciones. cuando el conector lo permita, pueden acotarse.
    - {id: no_sale_de_la_ventana, desc: "si los datos son de quien pregunta (su cartola, su casa, el excel de su trabajo), no salen de la conversación: nada se publica, se comparte ni se guarda fuera sin que ella lo pida"}
    - {id: lo_que_falta_no_es_cero, desc: "un dato que falta no es cero ni se rellena: se dice que falta y por qué, en la misma vista (un mes sin registro, un niño que no levantó la mano, una categoría que la cartola no trae)"}
    - {id: en_la_sala_nadie_senalado, desc: "si los datos se levantan con las mismas personas que miran (un curso, un taller), nadie queda señalado frente a los demás: grupos y conteos, sin nombres; un grupo de una o dos personas se junta con otro o se cuenta sin mostrar quién"}
    # v0.3, opus 5.5, de la carta de romina (#19, «más divertido que el colegio, donde nos calificaban») e issue #23 punto 3.
    # universal: no hay ámbito donde una experiencia de este motor ponga nota a quien la mira.
    - {id: no_se_califica, desc: "la experiencia no califica a quien mira: no pone nota ni puntaje, no dice «bien» o «mal» a una predicción ni a una duda. si alguien adivinó y el dato fue otro, la diferencia dice algo del mundo, no de la persona («pensaste 30, fueron 12: ¿qué te sorprendió?»); el feedback de recall_guess_feedback describe el dato. mostrar las notas de un curso es otra cosa: ahí mandan en_la_sala_nadie_senalado y sin_identificables"}
  blandas:
    - {id: sin_marco_deficit, desc: "evitar semáforos y 'zonas rojas' sobre barrios", peso: alto}
    - {id: firma_no_color, desc: "lo distintivo viene del trazo o la operación, no de la paleta por defecto", peso: medio}
    - {id: un_mensaje_por_vista, desc: "una pregunta, un título-conclusión", peso: alto}
  # aplicabilidad — opus 5.5, 2-nov-2026, tras el P1 de sol en el #3 (25-sep y 2-nov).
  # las restricciones de arriba nacieron del caso territorial (lo hermida) y quedan con sus palabras.
  # lo que cambia es dónde aplican: una restricción que no aparece en `aplicabilidad` vale en todo ámbito;
  # una que aparece, solo en los ámbitos listados. INFERENCIA: el criterio es la unidad de análisis.
  ambitos:
    - {id: territorio_o_servicio, desc: "la unidad de análisis es un lugar o un servicio: manzana, unidad vecinal, comuna, sede, consultorio. corresponde a unidad_analisis territorio o servicio de la VES"}
    - {id: personas, desc: "la unidad de análisis es una persona (estudiante, paciente, trabajadora), siempre desidentificada"}
    # v0.2, opus 5.5, 2-nov-2026: dos ámbitos para la gente de PARA_QUIEN.md. el criterio se amplía (INFERENCIA):
    # además de la unidad de análisis, cuenta de quién son los datos y quién los va a mirar. ver `como_elegir_ambito` abajo.
    # sin_datos_personales y tres_nadas no aplican aquí (su aplicabilidad ya es solo territorio_o_servicio).
    - {id: datos_propios, desc: "los datos son de quien pregunta: su cartola, su boleta, su casa, su perro, el excel de su trabajo. la unidad puede ser ella misma, sus cosas o su organización. si la unidad son otras personas que no están en la conversación, el ámbito es personas"}
    - {id: la_sala, desc: "los datos son de un grupo que comparte un espacio (un curso, un taller, una reunión), levantados con ellos o sobre ellos, para mostrárselos a ellos mismos o a quien los cuida (apoderados)"}
    # v0.3, opus 5.5, issue #22 (un sonnet clasificando instancias de un modelo no encontró ámbito y eligió personas).
    # sin_datos_personales y tres_nadas no aplican aquí (su aplicabilidad ya es solo territorio_o_servicio).
    - {id: cosas, desc: "la unidad de análisis no es una persona ni un lugar, y los datos no son de nadie en la conversación: instancias de un modelo, productos de un catálogo, máquinas, piezas, animales, especies. aquí la privacidad no es el riesgo; el riesgo es no decir qué cuenta como uno (CU-11) y titular un proxy como hecho (definicion_junto_al_dato). si las cosas son de quien pregunta (sus ventas, su perro), el ámbito es datos_propios"}
  aplicabilidad:
    sin_datos_personales: [territorio_o_servicio]   # en ese ámbito la unidad nunca es una persona; con personas manda sin_identificables
    tres_nadas: [territorio_o_servicio]             # las tres clases de vacío son de la geografía censal (sin residentes, fusión, agregación propia)
    # autocontenido no se acota: su condición ya es la superficie («si se publica como página»), no el dominio.
    # sin teselas ni APIs externas protege a quien lee la página, sea cual sea el tema.

aristas:
  tarea_forma:
    magnitud: [unit_chart, dorling, cifra_grande, pictograma, palitos, tabla_en_voz_alta, lista_corta, cuenta_a_la_vista]  # + v0.2 opus: INFERENCIA desde el corpus: 38 de 54 preguntas ubicadas caían aquí y recibían solo isotype y dorling
    localizar: [mapa_sin_base, mosaico_uv, escala_con_tramos]  # + v0.2 opus: INFERENCIA: ubicar un valor en sus tramos es la misma operación que ubicarlo en un mapa (num-09, num-17)
    comparar: [pequenos_multiplos, ranked_dots, dorling, barras_simples, antes_y_despues, tabla_en_voz_alta, cuenta_a_la_vista, palitos]  # + v0.2 opus: INFERENCIA (prof-09, num-18, ppt-04; palitos: votar a mano alzada, prof-06)
