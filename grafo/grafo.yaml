  leer:          {es: ["qué me quieren decir", "no entiendo este gráfico", "cómo se lee", "explícamelo"], pt: ["não entendo esse gráfico", "como se lê"], en: ["what is this chart telling me", "how do I read this"]}
  datos_propios: {es: ["mi cartola", "mi boleta", "mi perro", "el excel de la pega"], pt: ["meu extrato", "minha conta de luz", "meu cachorro"], en: ["my bank statement", "my bill", "my dog", "my work spreadsheet"]}
