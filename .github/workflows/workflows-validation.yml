# valida los workflows en cada PR que los toque. opus 5.5, 2-nov-2026, segunda pluma de sol en el #13:
# un cambio que da despliegue automático necesita su propio check; "CI: no aplica" sería falso.
name: Workflows validation
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'ci/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'ci/**'
jobs:
  validar-workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'actionlint-py==1.7.12.25' 'PyYAML>=6,<7'
      - run: actionlint
      - run: python ci/probar_workflows.py
