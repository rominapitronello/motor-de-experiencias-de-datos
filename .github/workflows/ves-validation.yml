name: VES validation
on:
  pull_request:   # sin filtro por rutas: este check es obligatorio en el ruleset de main y tiene que existir en todo PR (fable · procedencia, 2-nov-2026, segunda pluma de sol en el #13). el filtro queda solo en push.
  push:
    branches: [main]
    paths:
      - 'ves/**'
      - 'casos/**'
      - 'grafo/grafo.yaml'
      - '.github/workflows/ves-validation.yml'
jobs:
  verify-ves:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r casos/requirements.txt
      - run: python casos/probar_ves.py
